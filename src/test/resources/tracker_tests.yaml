# What a SpokenLineTracker makes of one transcript read against printed lines.
#
# A case gives the printed `lines`, optionally the `quirks` of the recogniser (written
# word to heard spellings, each a string or a `{heard, after}` pair) and the
# `interior_marks` of the tokenizer when it is not the Latin-script one.
#
# With `heard`, the transcript is checked, and the case pins whatever it names:
# `checks` in full, or `checks_at` by word index with `rest` for every word not named;
# `states_at` for display states; `complete` and `all_wrong`; `attempts` in full.
# `line_lengths` and `untried` need no transcript.
tests:
  - name: "a line said whole is complete"
    lines: ["From fairest creatures we desire increase,"]
    heard: "from fairest creatures we desire increase"
    rest: correct
    complete: true
    all_wrong: false

  - name: "a line half said is a line not said"
    lines: ["From fairest creatures we desire increase,"]
    heard: "from fairest creatures"
    checks: [correct, correct, correct, wrong, wrong, wrong]
    states_at: {3: missed, 4: missed, 5: missed}
    complete: false

  - name: "nothing heard yet is no progress and no words to fix"
    lines: ["From fairest creatures we desire increase,"]
    heard: ""
    checks: [wrong, wrong, wrong, wrong, wrong, wrong]
    complete: false
    all_wrong: true

  - name: "a reading nobody could make out is all wrong"
    lines: ["From fairest creatures we desire increase,"]
    heard: "the quick brown fox jumped over"
    all_wrong: true

  - name: "a reading that went wrong after its first word is not all wrong"
    lines: ["From fairest creatures we desire increase,"]
    heard: "from the quick brown fox jumped"
    all_wrong: false

  - name: "a short word one letter apart is still put opposite the word it answers"
    lines: ["Th’ expense of spirit in a waste of shame"]
    heard: "the expense of spirit in a waste of shame"
    checks_at: {0: close}
    rest: correct

  - name: "a word spelt differently is a different word, however close it looks"
    lines: ["From fairest creatures we desire increase,"]
    heard: "from farest creatures we desire increase"
    checks: [correct, close, correct, correct, correct, correct]
    states_at: {1: close}
    complete: false

  - name: "a word said with an ending that is not there is wrong, however close it looks"
    lines: ["But as the riper should by time decease,"]
    heard: "but as the ripers should by time decease"
    checks_at: {3: close, 4: correct}
    complete: false

  - name: "an elision the recogniser spells out in full counts as said"
    lines: ["Will be a tatter’d weed of small worth held:"]
    heard: "will be a tattered weed of small worth held"
    checks_at: {3: correct}
    complete: true

  - name: "a word patched for this recogniser passes as though it had been heard right"
    lines: ["Will be a tatter’d weed of small worth held:"]
    quirks: {"tatter’d": ["tattered"]}
    heard: "will be a tattered weed of small worth held"
    complete: true

  - name: "two written words the recogniser runs into one are patched as the pair they make"
    lines: ["For to thy sensual fault I bring in sense;"]
    quirks: {"in sense": ["incense"]}
    heard: "for to thy sensual fault I bring incense"
    complete: true

  - name: "a pair patched for one turn of phrase fires there"
    lines: ["I bring in sense;"]
    quirks: {"in sense": [{heard: "incense", after: "bring"}]}
    heard: "I bring incense"
    complete: true

  - name: "a pair patched for one turn of phrase does not fire elsewhere"
    lines: ["I burn in sense;"]
    quirks: {"in sense": [{heard: "incense", after: "bring"}]}
    heard: "I burn incense"
    complete: false

  - name: "a patch fires where its own word is expected"
    lines: ["Which, used, lives th’ executor to be."]
    quirks: {"th’": ["the"]}
    heard: "which used lives the executor to be"
    complete: true

  - name: "a patch does not disturb a word it was not written for"
    lines: ["And only herald to the gaudy spring,"]
    quirks: {"th’": ["the"]}
    heard: "and only herald to the gaudy spring"
    complete: true

  - name: "a dropped word leaves the line unfinished but does not cost the rest"
    lines: ["From fairest creatures we desire increase,"]
    heard: "from fairest creatures desire increase"
    checks: [correct, correct, correct, wrong, correct, correct]
    complete: false

  - name: "a false start before the line is skipped rather than held against the reader"
    lines: ["From fairest creatures we desire increase,"]
    heard: "wait sorry from fairest creatures"
    checks_at: {0: correct, 1: correct, 2: correct}

  - name: "a word said as something else is the only one marked wrong"
    lines: ["From fairest creatures we desire increase,"]
    heard: "from fairest butterfly we desire increase"
    checks: [correct, correct, wrong, correct, correct, correct]
    complete: false

  - name: "a mangled opening does not hide the words said correctly after it"
    lines: ["From fairest creatures we desire increase,"]
    heard: "From Fair Screeches V desire increase."
    checks: [correct, wrong, wrong, wrong, correct, correct]

  - name: "a hyphenated word heard as two words still counts as said"
    lines: ["Feed’st thy light’s flame with self-substantial fuel,"]
    heard: "feedst thy lights flame with self substantial fuel"
    rest: correct
    complete: true

  - name: "a patched word heard as two words still counts as said"
    lines: ["And burn the long-liv’d phoenix, in her blood;"]
    quirks: {"long-liv’d": ["longlived"]}
    heard: "and burn the long lived phoenix in her blood"
    complete: true

  - name: "two words heard as one still count as said"
    lines: ["And do what ever thou wilt swift-footed Time"]
    heard: "and do whatever thou wilt swift footed time"
    complete: true

  - name: "a line not yet attempted waits on its first word"
    lines: ["From fairest creatures we desire increase,"]
    untried: [expected, ahead, ahead, ahead, ahead, ahead]

  - name: "a transcript is cut into words by the tracker's own tokenizer"
    lines: ["col·lec·ció"]
    interior_marks: "·"
    heard: "col·lec·ció"
    line_lengths: [1]
    complete: true

  - name: "a piece is right only when every word of every line was said"
    lines:
      - "From fairest creatures we desire increase,"
      - "That thereby beauty's rose might never die,"
      - "But as the riper should by time decease,"
      - "His tender heir might bear his memory:"
    heard: >-
      From fairest creatures we desire increase,
      That thereby beauty's rose might never die,
      But as the riper should by time decease,
      His tender heir might bear his memory:
    line_lengths: [6, 7, 8, 7]
    complete: true

  - name: "a piece with only its first line said is not right"
    lines:
      - "From fairest creatures we desire increase,"
      - "That thereby beauty's rose might never die,"
      - "But as the riper should by time decease,"
      - "His tender heir might bear his memory:"
    heard: "From fairest creatures we desire increase,"
    complete: false

  - name: "a slip anywhere in the piece fails the piece"
    lines:
      - "From fairest creatures we desire increase,"
      - "That thereby beauty's rose might never die,"
      - "But as the riper should by time decease,"
      - "His tender heir might bear his memory:"
    heard: >-
      From fairest creatures we desire increase,
      That thereby beauty's rose might never die,
      But as the ripest should by time decease,
      His tender heir might bear his memory:
    checks_at: {16: close}
    rest: correct
    complete: false

  - name: "word attempts use the passage spelling and include correct words"
    lines: ["Love is not love"]
    heard: "glove is love"
    attempts:
      - {word: "Love", check: close}
      - {word: "is", check: correct}
      - {word: "not", check: wrong}
      - {word: "love", check: correct}

  - name: "a line on its own is a piece of one line"
    lines: ["From fairest creatures we desire increase,"]
    heard: "From fairest creatures we desire increase,"
    line_lengths: [6]
    complete: true
