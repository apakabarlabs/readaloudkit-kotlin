  - name: "an alignment without a recording is read without one"
    json: '{"version": "v1", "alignment": {"piece": "1", "duration": 2, "words": [{"line": 0, "text": "O", "start": 0, "end": 0.4}]}}'
    published:
      version: "v1"
      alignment:
        piece: "1"
        duration: 2
        words:
          - {line: 0, text: "O", start: 0, end: 0.4}

  - name: "words that start together and take no time are in order"
    json: '{"version": "v1", "alignment": {"piece": "1", "duration": 1, "words": [{"line": 0, "text": "a", "start": 0.5, "end": 0.5}, {"line": 1, "text": "b", "start": 0.5, "end": 0.5}]}}'
    published:
      version: "v1"
      alignment:
        piece: "1"
        duration: 1
        words:
          - {line: 0, text: "a", start: 0.5, end: 0.5}
          - {line: 1, text: "b", start: 0.5, end: 0.5}

  - name: "a document in UTF-8 behind a byte order mark is read"
    json: '{"version": "v1", "alignment": {"piece": "é", "duration": 1, "words": []}}'
    encoding: "utf-8-bom"
    published:
      version: "v1"
      alignment:
        piece: "é"
        duration: 1
        words: []

  - name: "a document in UTF-16 behind its byte order mark is refused as not UTF-8"
    json: '{"version": "v1", "alignment": {"piece": "1", "duration": 1, "words": []}}'
    encoding: "utf-16le-bom"
    not_utf8: true

  - name: "a document in UTF-16 without a byte order mark is refused as not UTF-8"
    json: '{"version": "v1", "alignment": {"piece": "1", "duration": 1, "words": []}}'
    encoding: "utf-16be"
    not_utf8: true

  - name: "a document in Latin-1 is refused as not UTF-8"
    json: '{"version": "v1", "alignment": {"piece": "é", "duration": 1, "words": []}}'
    encoding: "latin-1"
    not_utf8: true

  - name: "a second byte order mark is not JSON and is refused"
    json: '{"version": "v1", "alignment": {"piece": "1", "duration": 1, "words": []}}'
    encoding: "utf-8-bom-twice"
    malformed: true

  - name: "a lone surrogate escaped in a string is refused"
    json: '{"version": "v1", "alignment": {"piece": "\ud800", "duration": 1, "words": []}}'
    malformed: true

  - name: "a lone surrogate escaped in a field the document does not know is refused too"
    json: '{"version": "v1", "note": "\udc00", "alignment": {"piece": "1", "duration": 1, "words": []}}'
    malformed: true

  - name: "a surrogate pair escaped in a string is one character"
    json: '{"version": "v1", "alignment": {"piece": "\ud834\udd1e", "duration": 1, "words": []}}'
    published:
      version: "v1"
      alignment:
        piece: "\U0001D11E"
        duration: 1
        words: []

  - name: "a control character written raw inside a string is refused"
    json: "{\"version\": \"v\x01\", \"alignment\": {\"piece\": \"1\", \"duration\": 1, \"words\": []}}"
    malformed: true

  - name: "a tab written raw inside a string is refused"
    json: "{\"version\": \"v\t1\", \"alignment\": {\"piece\": \"1\", \"duration\": 1, \"words\": []}}"
    malformed: true

  - name: "a tab and a line break between tokens are only white space"
    json: "{\"version\":\t\"v1\",\n\"alignment\": {\"piece\": \"1\", \"duration\": 1, \"words\": []}}"
    published:
      version: "v1"
      alignment:
        piece: "1"
        duration: 1
        words: []

  - name: "a bare alignment, which no server publishes, is refused"
    json: '{"piece": "1", "duration": 1, "words": []}'
    malformed: true

  - name: "a document without its version is refused"
    json: '{"alignment": {"piece": "1", "duration": 1, "words": []}}'
    malformed: true

  - name: "a field the server adds to the document later is read past"
    json: '{"version": "v1", "reading": "shakespeare", "alignment": {"piece": "1", "duration": 1, "words": []}}'
    published:
      version: "v1"
      alignment:
        piece: "1"
        duration: 1
        words: []

  - name: "a piece named by a number rather than a string is refused"
    json: '{"version": "v1", "alignment": {"piece": 18, "duration": 4.5, "words": []}}'
    malformed: true

  - name: "a duration written as a string is refused"
    json: '{"version": "v1", "alignment": {"piece": "18", "duration": "4.5", "words": []}}'
    malformed: true

  - name: "a line written as a string is refused"
    json: '{"version": "v1", "alignment": {"piece": "1", "duration": 1, "words": [{"line": "0", "text": "a", "start": 0, "end": 0.1}]}}'
    malformed: true

  - name: "a line with a fraction is refused"
    json: '{"version": "v1", "alignment": {"piece": "1", "duration": 1, "words": [{"line": 0.5, "text": "a", "start": 0, "end": 0.1}]}}'
    malformed: true

  - name: "a line written with a decimal point but no fraction is that line"
    json: '{"version": "v1", "alignment": {"piece": "1", "duration": 1, "words": [{"line": 1.0, "text": "a", "start": 0, "end": 0.1}]}}'
    published:
      version: "v1"
      alignment:
        piece: "1"
        duration: 1
        words:
          - {line: 1, text: "a", start: 0, end: 0.1}

  - name: "the last line a 32-bit integer holds is read"
    json: '{"version": "v1", "alignment": {"piece": "1", "duration": 1, "words": [{"line": 2147483647, "text": "a", "start": 0, "end": 0.1}]}}'
    published:
      version: "v1"
      alignment:
        piece: "1"
        duration: 1
        words:
          - {line: 2147483647, text: "a", start: 0, end: 0.1}

  - name: "a line beyond a 32-bit integer is refused"
    json: '{"version": "v1", "alignment": {"piece": "1", "duration": 1, "words": [{"line": 2147483648, "text": "a", "start": 0, "end": 0.1}]}}'
    malformed: true

  - name: "a line below a 32-bit integer is refused"
    json: '{"version": "v1", "alignment": {"piece": "1", "duration": 1, "words": [{"line": -2147483649, "text": "a", "start": 0, "end": 0.1}]}}'
    malformed: true

  - name: "a word time written as a string is refused"
    json: '{"version": "v1", "alignment": {"piece": "1", "duration": 1, "words": [{"line": 0, "text": "a", "start": "0", "end": 0.1}]}}'
    malformed: true

  - name: "an alignment without its words is refused"
    json: '{"version": "v1", "alignment": {"piece": "1", "duration": 1}}'
    malformed: true

  - name: "a piece written as null is refused"
    json: '{"version": "v1", "alignment": {"piece": null, "duration": 1, "words": []}}'
    malformed: true

  - name: "a field the server adds to the alignment later is read past"
    json: '{"version": "v1", "alignment": {"piece": "18", "sonnet": 18, "duration": 4.5, "words": []}}'
    published:
      version: "v1"
      alignment:
        piece: "18"
        duration: 4.5
        words: []

  - name: "a field the server adds to a word later is read past"
    json: '{"version": "v1", "alignment": {"piece": "1", "duration": 1, "words": [{"line": 0, "text": "a", "start": 0, "end": 0.1, "confidence": 0.9}]}}'
    published:
      version: "v1"
      alignment:
        piece: "1"
        duration: 1
        words:
          - {line: 0, text: "a", start: 0, end: 0.1}

  - name: "an added field of another type is read past, not judged"
    json: '{"version": "v1", "alignment": {"piece": "1", "duration": 1, "speaker": {"name": "A"}, "words": []}}'
    published:
      version: "v1"
      alignment:
        piece: "1"
        duration: 1
        words: []

  - name: "an added field does not excuse times that cannot stand"
    json: '{"version": "v1", "alignment": {"piece": "1", "duration": 1, "speaker": "A", "words": [{"line": 0, "text": "a", "start": -1, "end": 0.1}]}}'
    timing_error: {kind: negative_start, word: 0, line: 0}

  - name: "a word that starts before the recording is refused"
    json: '{"version": "v1", "alignment": {"piece": "1", "duration": 1, "words": [{"line": 0, "text": "a", "start": -0.1, "end": 0.1}]}}'
    timing_error: {kind: negative_start, word: 0, line: 0}

  - name: "a word that ends before it starts is refused"
    json: '{"version": "v1", "alignment": {"piece": "1", "duration": 1, "words": [{"line": 0, "text": "a", "start": 0, "end": 0.2}, {"line": 0, "text": "b", "start": 0.4, "end": 0.3}]}}'
    timing_error: {kind: end_before_start, word: 1, line: 0}

  - name: "a word that starts before the one ahead of it on its line is refused"
    json: '{"version": "v1", "alignment": {"piece": "1", "duration": 1, "words": [{"line": 0, "text": "a", "start": 0.3, "end": 0.4}, {"line": 0, "text": "b", "start": 0.2, "end": 0.5}]}}'
    timing_error: {kind: start_before_previous, word: 1, line: 0}

  - name: "a word on the next line that starts before the word ahead of it is refused"
    json: '{"version": "v1", "alignment": {"piece": "1", "duration": 1, "words": [{"line": 0, "text": "a", "start": 0.3, "end": 0.4}, {"line": 1, "text": "b", "start": 0.1, "end": 0.2}]}}'
    timing_error: {kind: start_before_previous, word: 1, line: 1}

timings:
  - name: "measured times land on the words of the passage"
    lines: ["From fairest creatures", "we desire increase,"]
    interior_marks: "'’-"
    words:
      - {line: 0, text: "From", start: 0, end: 0.3}
      - {line: 0, text: "fairest", start: 0.3, end: 0.9}
      - {line: 0, text: "creatures", start: 0.9, end: 1.5}
      - {line: 1, text: "we", start: 1.8, end: 2.0}
      - {line: 1, text: "desire", start: 2.0, end: 2.5}
      - {line: 1, text: "increase", start: 2.5, end: 3.2}
    timings:
      - {text: "From", line: 0, start: 0, end: 0.3}
      - {text: "fairest", line: 0, start: 0.3, end: 0.9}
      - {text: "creatures", line: 0, start: 0.9, end: 1.5}
      - {text: "we", line: 1, start: 1.8, end: 2.0}
      - {text: "desire", line: 1, start: 2.0, end: 2.5}
      - {text: "increase", line: 1, start: 2.5, end: 3.2}

  - name: "a word spelt with a combining mark is the same word as its precomposed spelling"
    lines: ["cafe\u0301 au lait"]
    interior_marks: "'’-"
    words:
      - {line: 0, text: "caf\u00E9", start: 0, end: 0.4}
      - {line: 0, text: "au", start: 0.4, end: 0.5}
      - {line: 0, text: "lait", start: 0.5, end: 0.9}
    timings:
      - {text: "cafe\u0301", line: 0, start: 0, end: 0.4}
      - {text: "au", line: 0, start: 0.4, end: 0.5}
      - {text: "lait", line: 0, start: 0.5, end: 0.9}

  - name: "a text edited after the markup was made is refused, not slid by one word"
    lines: ["From fairest creatures", "we desire increase, and more"]
    interior_marks: "'’-"
    words:
      - {line: 0, text: "From", start: 0, end: 0.3}
      - {line: 0, text: "fairest", start: 0.3, end: 0.9}
      - {line: 0, text: "creatures", start: 0.9, end: 1.5}
      - {line: 1, text: "we", start: 1.8, end: 2.0}
      - {line: 1, text: "desire", start: 2.0, end: 2.5}
      - {line: 1, text: "increase", start: 2.5, end: 3.2}
    word_count_mismatch: {expected: 8, found: 6}

  - name: "a word swapped in the text is caught by name"
    lines: ["From fairest creatures", "we desire increases,"]
    interior_marks: "'’-"
    words:
      - {line: 0, text: "From", start: 0, end: 0.3}
      - {line: 0, text: "fairest", start: 0.3, end: 0.9}
      - {line: 0, text: "creatures", start: 0.9, end: 1.5}
      - {line: 1, text: "we", start: 1.8, end: 2.0}
      - {line: 1, text: "desire", start: 2.0, end: 2.5}
      - {line: 1, text: "increase", start: 2.5, end: 3.2}
    word_mismatch: {index: 5, expected: "increases", found: "increase", expected_line: 1, found_line: 1}

  - name: "a word moved to another line is caught even when the spelling matches"
    lines: ["From fairest creatures we", "desire increase,"]
    interior_marks: "'’-"
    words:
      - {line: 0, text: "From", start: 0, end: 0.3}
      - {line: 0, text: "fairest", start: 0.3, end: 0.9}
      - {line: 0, text: "creatures", start: 0.9, end: 1.5}
