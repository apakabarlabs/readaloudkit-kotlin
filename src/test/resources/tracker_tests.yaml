# What a SpokenLineTracker makes of one transcript read against printed lines.
#
# A case gives the printed `lines`, the `interior_marks` a word of their language may
# hold, which every case names because no language is assumed, optionally the
# `elisions` the work lists (elided spelling to the full forms it may stand for; none
# when absent), and optionally the `quirks` of the recogniser (written word to heard
# spellings, each a string or a `{heard, after}` pair).
#
# Every case pins `line_lengths`. With `heard`, the transcript is checked, and the case
# pins the whole result: every word's check in `checks`, `complete` and `all_wrong`.
# `attempts` and `untried` pin those where a case is about them.
tests:
  - name: "a line said whole is complete"
    lines: ["From fairest creatures we desire increase,"]
    interior_marks: "'’-"
    line_lengths: [6]
    heard: "from fairest creatures we desire increase"
    checks: [correct, correct, correct, correct, correct, correct]
    complete: true
    all_wrong: false

  - name: "a line half said is a line not said"
    lines: ["From fairest creatures we desire increase,"]
    interior_marks: "'’-"
    line_lengths: [6]
    heard: "from fairest creatures"
    checks: [correct, correct, correct, wrong, wrong, wrong]
    complete: false
    all_wrong: false

  - name: "nothing heard yet is no progress and no words to fix"
    lines: ["From fairest creatures we desire increase,"]
    interior_marks: "'’-"
    line_lengths: [6]
    heard: ""
    checks: [wrong, wrong, wrong, wrong, wrong, wrong]
    complete: false
    all_wrong: true

  - name: "a reading nobody could make out is all wrong"
    lines: ["From fairest creatures we desire increase,"]
    interior_marks: "'’-"
    line_lengths: [6]
    heard: "the quick brown fox jumped over"
    checks: [wrong, wrong, wrong, wrong, wrong, wrong]
    complete: false
    all_wrong: true

  - name: "a reading that went wrong after its first word is not all wrong"
    lines: ["From fairest creatures we desire increase,"]
    interior_marks: "'’-"
    line_lengths: [6]
    heard: "from the quick brown fox jumped"
    checks: [correct, wrong, wrong, wrong, wrong, wrong]
    complete: false
    all_wrong: false

  - name: "a short word one letter apart is still put opposite the word it answers"
    lines: ["Th’ expense of spirit in a waste of shame"]
    interior_marks: "'’-"
    line_lengths: [9]
    heard: "the expense of spirit in a waste of shame"
    checks: [close, correct, correct, correct, correct, correct, correct, correct, correct]
    complete: false
    all_wrong: false

  - name: "a word spelt differently is a different word, however close it looks"
    lines: ["From fairest creatures we desire increase,"]
    interior_marks: "'’-"
    line_lengths: [6]
    heard: "from farest creatures we desire increase"
    checks: [correct, close, correct, correct, correct, correct]
    complete: false
    all_wrong: false

  - name: "a word said with an ending that is not there is wrong, however close it looks"
    lines: ["But as the riper should by time decease,"]
    interior_marks: "'’-"
    line_lengths: [8]
    heard: "but as the ripers should by time decease"
    checks: [correct, correct, correct, close, correct, correct, correct, correct]
    complete: false
    all_wrong: false

  - name: "an elision the recogniser spells out in full counts as said"
    lines: ["Will be a tatter’d weed of small worth held:"]
    interior_marks: "'’-"
    elisions: {"tatter’d": ["tattered"]}
    line_lengths: [9]
    heard: "will be a tattered weed of small worth held"
    checks: [correct, correct, correct, correct, correct, correct, correct, correct, correct]
    complete: true
    all_wrong: false

  - name: "an elision the work does not list is not restored by any rule of the library"
    lines: ["Will be a tatter’d weed of small worth held:"]
    interior_marks: "'’-"
    line_lengths: [9]
    heard: "will be a tattered weed of small worth held"
    checks: [correct, correct, correct, close, correct, correct, correct, correct, correct]
    complete: false
    all_wrong: false

  - name: "a word patched for this recogniser passes as though it had been heard right"
    lines: ["Will be a tatter’d weed of small worth held:"]
    interior_marks: "'’-"
    line_lengths: [9]
    quirks: {"tatter’d": ["tattered"]}
    heard: "will be a tattered weed of small worth held"
    checks: [correct, correct, correct, correct, correct, correct, correct, correct, correct]
    complete: true
    all_wrong: false

  - name: "two written words the recogniser runs into one are patched as the pair they make"
    lines: ["For to thy sensual fault I bring in sense;"]
    interior_marks: "'’-"
    line_lengths: [9]
    quirks: {"in sense": ["incense"]}
    heard: "for to thy sensual fault I bring incense"
    checks: [correct, correct, correct, correct, correct, correct, correct, correct, correct]
    complete: true
    all_wrong: false

  - name: "a pair patched for one turn of phrase fires there"
    lines: ["I bring in sense;"]
    interior_marks: "'’-"
    line_lengths: [4]
    quirks: {"in sense": [{heard: "incense", after: "bring"}]}
    heard: "I bring incense"
    checks: [correct, correct, correct, correct]
    complete: true
    all_wrong: false

  - name: "a pair patched for one turn of phrase does not fire elsewhere"
    lines: ["I burn in sense;"]
    interior_marks: "'’-"
    line_lengths: [4]
    quirks: {"in sense": [{heard: "incense", after: "bring"}]}
    heard: "I burn incense"
    checks: [correct, correct, wrong, wrong]
    complete: false
    all_wrong: false

  - name: "a patch fires where its own word is expected"
    lines: ["Which, used, lives th’ executor to be."]
    interior_marks: "'’-"
    line_lengths: [7]
    quirks: {"th’": ["the"]}
    heard: "which used lives the executor to be"
    checks: [correct, correct, correct, correct, correct, correct, correct]
    complete: true
    all_wrong: false

  - name: "a patch does not disturb a word it was not written for"
    lines: ["And only herald to the gaudy spring,"]
    interior_marks: "'’-"
    line_lengths: [7]
    quirks: {"th’": ["the"]}
    heard: "and only herald to the gaudy spring"
    checks: [correct, correct, correct, correct, correct, correct, correct]
    complete: true
    all_wrong: false

  - name: "a dropped word leaves the line unfinished but does not cost the rest"
    lines: ["From fairest creatures we desire increase,"]
    interior_marks: "'’-"
    line_lengths: [6]
    heard: "from fairest creatures desire increase"
    checks: [correct, correct, correct, wrong, correct, correct]
    complete: false
    all_wrong: false

  - name: "a false start before the line is skipped rather than held against the reader"
    lines: ["From fairest creatures we desire increase,"]
    interior_marks: "'’-"
    line_lengths: [6]
    heard: "wait sorry from fairest creatures"
    checks: [correct, correct, correct, wrong, wrong, wrong]
    complete: false
    all_wrong: false

  - name: "a word said as something else is the only one marked wrong"
    lines: ["From fairest creatures we desire increase,"]
    interior_marks: "'’-"
    line_lengths: [6]
    heard: "from fairest butterfly we desire increase"
    checks: [correct, correct, wrong, correct, correct, correct]
    complete: false
    all_wrong: false

  - name: "a mangled opening does not hide the words said correctly after it"
    lines: ["From fairest creatures we desire increase,"]
    interior_marks: "'’-"
    line_lengths: [6]
    heard: "From Fair Screeches V desire increase."
    checks: [correct, wrong, wrong, wrong, correct, correct]
    complete: false
    all_wrong: false

  - name: "a hyphenated word heard as two words still counts as said"
    lines: ["Feed’st thy light’s flame with self-substantial fuel,"]
    interior_marks: "'’-"
    line_lengths: [7]
    heard: "feedst thy lights flame with self substantial fuel"
    checks: [correct, correct, correct, correct, correct, correct, correct]
    complete: true
    all_wrong: false

  - name: "a patched word heard as two words still counts as said"
    lines: ["And burn the long-liv’d phoenix, in her blood;"]
    interior_marks: "'’-"
    line_lengths: [8]
    quirks: {"long-liv’d": ["longlived"]}
    heard: "and burn the long lived phoenix in her blood"
    checks: [correct, correct, correct, correct, correct, correct, correct, correct]
    complete: true
    all_wrong: false

  - name: "two words heard as one still count as said"
    lines: ["And do what ever thou wilt swift-footed Time"]
    interior_marks: "'’-"
    line_lengths: [8]
    heard: "and do whatever thou wilt swift footed time"
    checks: [correct, correct, correct, correct, correct, correct, correct, correct]
    complete: true
    all_wrong: false

  - name: "a line not yet attempted waits on its first word"
    lines: ["From fairest creatures we desire increase,"]
    interior_marks: "'’-"
    line_lengths: [6]
    untried: [expected, ahead, ahead, ahead, ahead, ahead]

  - name: "a transcript is cut into words by the tracker's own tokenizer"
    lines: ["col·lec·ció"]
    interior_marks: "·"
    line_lengths: [1]
    heard: "col·lec·ció"
    checks: [correct]
    complete: true
    all_wrong: false

  - name: "a piece is right only when every word of every line was said"
    lines:
      - "From fairest creatures we desire increase,"
      - "That thereby beauty's rose might never die,"
      - "But as the riper should by time decease,"
      - "His tender heir might bear his memory:"
    interior_marks: "'’-"
    line_lengths: [6, 7, 8, 7]
    heard: >-
      From fairest creatures we desire increase,
      That thereby beauty's rose might never die,
      But as the riper should by time decease,
      His tender heir might bear his memory:
    checks: [
      correct, correct, correct, correct, correct, correct,
      correct, correct, correct, correct, correct, correct, correct,
      correct, correct, correct, correct, correct, correct, correct, correct,
      correct, correct, correct, correct, correct, correct, correct]
    complete: true
    all_wrong: false

  - name: "a piece with only its first line said is not right"
    lines:
      - "From fairest creatures we desire increase,"
      - "That thereby beauty's rose might never die,"
      - "But as the riper should by time decease,"
      - "His tender heir might bear his memory:"
    interior_marks: "'’-"
    line_lengths: [6, 7, 8, 7]
    heard: "From fairest creatures we desire increase,"
    checks: [
      correct, correct, correct, correct, correct, correct,
      wrong, wrong, wrong, wrong, wrong, wrong, wrong,
      wrong, wrong, wrong, wrong, wrong, wrong, wrong, wrong,
      wrong, wrong, wrong, wrong, wrong, wrong, wrong]
    complete: false
    all_wrong: false

  - name: "a slip anywhere in the piece fails the piece"
    lines:
      - "From fairest creatures we desire increase,"
      - "That thereby beauty's rose might never die,"
      - "But as the riper should by time decease,"
      - "His tender heir might bear his memory:"
    interior_marks: "'’-"
    line_lengths: [6, 7, 8, 7]
    heard: >-
      From fairest creatures we desire increase,
      That thereby beauty's rose might never die,
      But as the ripest should by time decease,
      His tender heir might bear his memory:
    checks: [
      correct, correct, correct, correct, correct, correct,
      correct, correct, correct, correct, correct, correct, correct,
      correct, correct, correct, close, correct, correct, correct, correct,
      correct, correct, correct, correct, correct, correct, correct]
    complete: false
    all_wrong: false
    attempts:
      - {word: "From", check: correct}
      - {word: "fairest", check: correct}
      - {word: "creatures", check: correct}
      - {word: "we", check: correct}
      - {word: "desire", check: correct}
      - {word: "increase", check: correct}
      - {word: "That", check: correct}
      - {word: "thereby", check: correct}
      - {word: "beauty's", check: correct}
      - {word: "rose", check: correct}
      - {word: "might", check: correct}
      - {word: "never", check: correct}
      - {word: "die", check: correct}
      - {word: "But", check: correct}
      - {word: "as", check: correct}
      - {word: "the", check: correct}
      - {word: "riper", check: close}
      - {word: "should", check: correct}
      - {word: "by", check: correct}
      - {word: "time", check: correct}
      - {word: "decease", check: correct}
      - {word: "His", check: correct}
      - {word: "tender", check: correct}
      - {word: "heir", check: correct}
      - {word: "might", check: correct}
      - {word: "bear", check: correct}
      - {word: "his", check: correct}
      - {word: "memory", check: correct}

  - name: "word attempts use the passage spelling and include correct words"
    lines: ["Love is not love"]
    interior_marks: "'’-"
    line_lengths: [4]
    heard: "glove is love"
    checks: [close, correct, wrong, correct]
    complete: false
    all_wrong: false
    attempts:
      - {word: "Love", check: close}
      - {word: "is", check: correct}
      - {word: "not", check: wrong}
      - {word: "love", check: correct}

  - name: "a line on its own is a piece of one line"
    lines: ["From fairest creatures we desire increase,"]
    interior_marks: "'’-"
    line_lengths: [6]
    heard: "From fairest creatures we desire increase,"
    checks: [correct, correct, correct, correct, correct, correct]
    complete: true
    all_wrong: false

# What a recogniser answers once its hearing table is applied to its own transcript, as
# against the same printed `lines`: each case gives `interior_marks`, optionally
# `quirks` and `elisions` as above, the `heard` transcript and the `corrected` one.
corrections:
  - name: "a patched spelling comes back printed, the rest as heard"
    lines: ["Alack! what poverty my Muse brings forth,"]
    interior_marks: "'’-"
    quirks: {"alack": ["alac"]}
    heard: "Alac! what poverty my muse brings forth."
    corrected: "Alack! what poverty my muse brings forth."

  - name: "a patch tied to a neighbour restores only after that neighbour"
    lines: ["among a crowd"]
    interior_marks: "'’-"
    quirks: {"a": [{heard: "the", after: "among"}]}
    heard: "among the crowd"
    corrected: "among a crowd"

  - name: "a patch tied to a neighbour leaves the word alone elsewhere"
    lines: ["in a crowd"]
    interior_marks: "'’-"
    quirks: {"a": [{heard: "the", after: "among"}]}
    heard: "in the crowd"
    corrected: "in the crowd"

  - name: "a listed full form is left for the reader's check"
    lines: ["his tatter’d weed"]
    interior_marks: "'’-"
    elisions: {"tatter’d": ["tattered"]}
    heard: "his tattered weed"
    corrected: "his tattered weed"

  - name: "without a table the transcript is answered untouched"
    lines: ["Alack! what poverty"]
    interior_marks: "'’-"
    heard: "Alac, what poverty"
    corrected: "Alac, what poverty"

  - name: "a word the table does not patch keeps its spelling however close"
    lines: ["Alack! what poverty"]
    interior_marks: "'’-"
    quirks: {"alack": ["alac"]}
    heard: "alac what povery"
    corrected: "Alack what povery"

  - name: "a patch for two printed words heard as one brings both back"
    lines: ["bring in sense"]
    interior_marks: "'’-"
    quirks: {"in sense": ["incense"]}
    heard: "bring incense"
    corrected: "bring in sense"

  - name: "nothing heard is nothing answered"
    lines: ["Alack! what poverty"]
    interior_marks: "'’-"
    quirks: {"alack": ["alac"]}
    heard: ""
    corrected: ""
