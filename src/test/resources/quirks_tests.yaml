# Which heard spellings a recogniser's hearing table allows for a written word.
#
# A case reads the table the server publishes for one recogniser build, `{"build": ...,
# "version": ..., "words": {written: [{"heard": ..., "after": ...}]}}`, from `served`, a
# file beside this one fetched by `make served`, or from `table` written in `encoding`
# (as in alignment_tests.yaml; `utf-8` when absent), asking for `build`. Or it gives
# `allowances` directly: written word to heard spellings, each a string or a
# `{heard, after}` pair. A table published for another build is refused with
# `wrong_build`, the build asked for and the one published; bytes that are not UTF-8
# text with `not_utf8`; a table that lacks a field or has another shape or type as
# `malformed`, while a field it does not know is read past, since a build in a store
# cannot learn a field the server adds later. Otherwise `empty` says whether any
# substitution is allowed, and each query asks whether `heard` is allowed for
# `written`, after `after` if given.
tests:
  - name: "a build's hearing table is read as it is served"
    served: "served_hearing.json"
    build: "parakeet-tdt-0.6b-v3-sherpa-int8"
    empty: false
    queries:
      - {heard: "alac", written: "alack", allowed: true}
      - {heard: "absent", written: "absence", after: "though", allowed: true}
      - {heard: "absent", written: "absence", after: "love", allowed: false}
      - {heard: "absent", written: "absence", allowed: false}
      - {heard: "colored", written: "colour’d", after: "woman", allowed: true}
      - {heard: "tattered", written: "battered", allowed: false}

  - name: "a table published for another build is refused, not taken for this one"
    served: "served_hearing.json"
    build: "parakeet-tdt-0.6b-v4"
    wrong_build: {requested: "parakeet-tdt-0.6b-v4", published: "parakeet-tdt-0.6b-v3-sherpa-int8"}

  - name: "a build with no patches needs none"
    table: '{"build": "spotless", "version": "v1", "words": {}}'
    build: "spotless"
    empty: true
    queries:
      - {heard: "tattered", written: "tatter''d", allowed: false}

  - name: "a table in UTF-8 behind a byte order mark is read"
    table: '{"build": "parakeet", "version": "v1", "words": {"in": [{"heard": "and"}]}}'
    encoding: "utf-8-bom"
    build: "parakeet"
    empty: false
    queries:
      - {heard: "and", written: "in", allowed: true}

  - name: "a second byte order mark before a table is refused"
    table: '{"build": "parakeet", "version": "v1", "words": {}}'
    encoding: "utf-8-bom-twice"
    build: "parakeet"
    malformed: true

  - name: "a lone surrogate escaped in a heard spelling is refused"
    table: '{"build": "parakeet", "version": "v1", "words": {"in": [{"heard": "\ud800"}]}}'
    build: "parakeet"
    malformed: true

  - name: "a control character written raw in a heard spelling is refused"
    table: "{\"build\": \"parakeet\", \"version\": \"v1\", \"words\": {\"in\": [{\"heard\": \"a\x7Fnd\x1F\"}]}}"
    build: "parakeet"
    malformed: true

  - name: "a build written as a number is refused"
    table: '{"build": 4, "version": "v1", "words": {}}'
    build: "parakeet"
    malformed: true

  - name: "an after written as a number is refused"
    table: '{"build": "parakeet", "version": "v1", "words": {"in": [{"heard": "and", "after": 7}]}}'
    build: "parakeet"
    malformed: true

  - name: "a misspelt after is a field nobody reads, so the allowance holds after any word"
    table: '{"build": "parakeet", "version": "v1", "words": {"in": [{"heard": "and", "afer": "each"}]}}'
    build: "parakeet"
    empty: false
    queries:
      - {heard: "and", written: "in", after: "each", allowed: true}
      - {heard: "and", written: "in", after: "delights", allowed: true}

  - name: "a table in UTF-16 is refused as not UTF-8"
    table: '{"build": "parakeet", "version": "v1", "words": {}}'
    encoding: "utf-16le-bom"
    build: "parakeet"
    not_utf8: true

  - name: "a table without its version is refused"
    table: '{"build": "parakeet", "words": {}}'
    build: "parakeet"
    malformed: true

  - name: "a table without its build is refused"
    table: '{"version": "v1", "words": {}}'
    build: "parakeet"
    malformed: true

  - name: "a table of builds, which no server publishes, is refused"
    table: '{"parakeet": {"tatter''d": [{"heard": "tattered"}]}}'
    build: "parakeet"
    malformed: true

  - name: "a field the server adds to the table later is read past"
    table: '{"build": "parakeet", "version": "v1", "model": "parakeet", "words": {"in": [{"heard": "and", "after": "each"}]}}'
    build: "parakeet"
    empty: false
    queries:
      - {heard: "and", written: "in", after: "each", allowed: true}

  - name: "words that are not a table of written words are refused"
    table: '{"build": "parakeet", "version": "v1", "words": ["tattered"]}'
    build: "parakeet"
    malformed: true

  - name: "a written word whose allowances are not a list is refused"
    table: '{"build": "parakeet", "version": "v1", "words": {"tatter''d": {"heard": "tattered"}}}'
    build: "parakeet"
    malformed: true

  - name: "a bare heard spelling, which no server publishes, is refused"
    table: '{"build": "parakeet", "version": "v1", "words": {"tatter''d": ["tattered"]}}'
    build: "parakeet"
    malformed: true

  - name: "an allowance without a heard spelling is refused"
    table: '{"build": "parakeet", "version": "v1", "words": {"in": [{"after": "each"}]}}'
    build: "parakeet"
    malformed: true

  - name: "a heard spelling that is not a string is refused"
    table: '{"build": "parakeet", "version": "v1", "words": {"in": [{"heard": 7}]}}'
    build: "parakeet"
    malformed: true

  - name: "a field the server adds to an allowance later is read past"
    table: '{"build": "parakeet", "version": "v1", "words": {"in": [{"heard": "and", "before": "each"}]}}'
    build: "parakeet"
    empty: false
    queries:
      - {heard: "and", written: "in", allowed: true}

  - name: "a table that is not an object is refused"
    table: '["parakeet"]'
    build: "parakeet"
    malformed: true

  - name: "two spellings of one key are added together, not one over the other"
    allowances:
      "Whate’er": ["whatever"]
      "whate’er": ["what’er"]
    empty: false
    queries:
      - {heard: "whatever", written: "Whate’er", allowed: true}
      - {heard: "whater", written: "whate’er", allowed: true}
      - {heard: "whenever", written: "whate’er", allowed: false}
