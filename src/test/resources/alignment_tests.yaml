# Supplied word times: how an alignment is read, and how it is married to a passage.
#
# `decode` cases read the document the server publishes, `{"version": ...,
# "alignment": {...}}`: from `served`, a file beside this one fetched from the server
# by `make served`, or from `json`, written in `encoding`: `utf-8` when absent,
# `utf-8-bom`, `utf-8-bom-twice`, `utf-16le`, `utf-16le-bom`, `utf-16be` or `latin-1`. A field the document
# does not know is read past, since a build in a store cannot learn a field the server
# adds later. A case that decodes pins the whole document in `published`; `not_utf8`
# says the bytes are not UTF-8 text; `malformed` says the JSON lacks a field or has
# another shape or type than the document's; `timing_error` names the first word whose
# times cannot stand, by its `kind`, its index in `word` and its printed `line`.
#
# `timings` cases marry `words` to the passage of `lines`, split by a tokenizer that
# keeps the `interior_marks` of their language, which every such case names. A case
# that fits pins every timing; a refused case names its error:
# `word_count_mismatch` or `word_mismatch`, with every field the error carries.
