# Which heard words faithfully represent the written words they were paired with.
#
# `matches` is every pair the aligner made, in order, each as half-open `[lower, upper)`
# ranges of expected and heard word indices; `faithful` is the set of match indices
# accepted. `quirks` maps a written word to heard spellings. `elisions` maps an elided
# spelling the work prints to the full form it stands for; none when absent.
#
# `faithful` cases ask whether `heard` faithfully represents `written` given the
# work's `elisions`.
tests:
  - name: "a word said as written is faithful"
    expected: ["love"]
    heard: ["love"]
    matches:
      - {expected: [0, 1], heard: [0, 1]}
    faithful: [0]

  - name: "a similar word is paired but not faithful"
    expected: ["love"]
    heard: ["dove"]
    matches:
      - {expected: [0, 1], heard: [0, 1]}
    faithful: []

  - name: "an elision spelled out is faithful when the work gives its full form"
    expected: ["tatter’d"]
    heard: ["tattered"]
    elisions: {"tatter’d": "tattered"}
    matches:
      - {expected: [0, 1], heard: [0, 1]}
    faithful: [0]

  - name: "an elision spelled out is paired but not faithful when the work lists none"
    expected: ["tatter’d"]
    heard: ["tattered"]
    matches:
      - {expected: [0, 1], heard: [0, 1]}
    faithful: []

  - name: "a listed full form pairs its elision however unlike they look"
    expected: ["o’er"]
    heard: ["over"]
    elisions: {"o’er": "over"}
    matches:
      - {expected: [0, 1], heard: [0, 1]}
    faithful: [0]

  - name: "a patched word is paired by the patch and then accepted by it"
    expected: ["heir"]
    heard: ["air"]
    quirks: {"heir": ["air"], "O": ["oh"]}
    matches:
      - {expected: [0, 1], heard: [0, 1]}
    faithful: [0]

  - name: "without the table the same pair is not even put together"
    expected: ["heir"]
    heard: ["air"]
    matches: []
    faithful: []

  - name: "a word nothing was heard for is neither paired nor faithful"
    expected: ["love", "is"]
    heard: ["love"]
    matches:
      - {expected: [0, 1], heard: [0, 1]}
    faithful: [0]

  - name: "two written words heard as one are one match"
    expected: ["what", "ever"]
    heard: ["whatever"]
    matches:
      - {expected: [0, 2], heard: [0, 1]}
    faithful: [0]

faithful:
  - {name: "a word said as written is faithful whatever the work lists", heard: "Time", written: "time", faithful: true}
  - {name: "a word without an apostrophe is only itself", heard: "time", written: "times", faithful: false}
  - {name: "a listed elision is restored to its full form", heard: "tattered", written: "tatter’d", elisions: {"tatter’d": "tattered"}, faithful: true}
  - {name: "an elision the work does not list is not restored", heard: "tattered", written: "tatter’d", faithful: false}
  - {name: "a full form stands only for the elision it is listed for", heard: "tattered", written: "tatter’d", elisions: {"crown’d": "crowned"}, faithful: false}
  - {name: "a keyed apostrophe in the list stands for a typeset one in print", heard: "crowned", written: "crown’d", elisions: {"crown'd": "crowned"}, faithful: true}
  - {name: "only the listed full form is restored, not another spelling near it", heard: "crownded", written: "crown’d", elisions: {"crown’d": "crowned"}, faithful: false}
  - {name: "an elision may not be left out", heard: "crown", written: "crown’d", elisions: {"crown’d": "crowned"}, faithful: false}
